<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드라마 사주 궁합</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe4; --paper:#fffaf1; --ink:#2b2420; --muted:#7b6f63; --line:#e3d7c3;
  --accent:#b23a2e; --accent2:#1f3a5f; --gold:#b98a3a;
  --wood:#3f8f5a; --fire:#d2493b; --earth:#c08a2e; --metal:#8a929c; --water:#2c4f86;
  --shadow:0 10px 30px rgba(60,40,20,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --paper:#211c17; --ink:#f1e8da; --muted:#a8998a; --line:#3a3128;
    --accent:#e2675a; --accent2:#8fb0dc; --gold:#d9ad5c;
    --wood:#5fb87b; --fire:#ef6b5c; --earth:#dcaa4c; --metal:#b4bcc6; --water:#6d93d1;
    --shadow:0 10px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16130f; --paper:#211c17; --ink:#f1e8da; --muted:#a8998a; --line:#3a3128;
  --accent:#e2675a; --accent2:#8fb0dc; --gold:#d9ad5c;
  --wood:#5fb87b; --fire:#ef6b5c; --earth:#dcaa4c; --metal:#b4bcc6; --water:#6d93d1;
  --shadow:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;
  background-image:radial-gradient(circle at 15% 10%,rgba(178,58,46,.06),transparent 40%),radial-gradient(circle at 85% 80%,rgba(31,58,95,.07),transparent 45%);}
.wrap{max-width:980px;margin:0 auto;padding:32px 16px 64px}
header{text-align:center;margin-bottom:28px}
.seal{display:inline-grid;place-items:center;width:56px;height:56px;border:2px solid var(--accent);color:var(--accent);
  font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px;border-radius:10px;transform:rotate(-6deg);margin-bottom:10px}
h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(28px,5vw,40px);margin:0 0 6px;letter-spacing:-.5px}
.sub{color:var(--muted);margin:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
.step{display:flex;align-items:center;gap:10px;font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:20px;margin:0 0 16px}
.step b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-family:'Noto Sans KR';font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:11px 0;border:0;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.seg button.on{background:var(--accent2);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ch{position:relative;border:2px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;background:var(--bg);transition:.15s;font:inherit;color:inherit}
.ch:hover{transform:translateY(-2px);border-color:var(--gold)}
.ch.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(178,58,46,.15)}
.av{width:58px;height:58px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:28px;color:#fff}
.ch .nm{font-weight:700;font-size:16px}
.ch .dr{font-size:12px;color:var(--muted)}
.ch .dm{font-size:11px;margin-top:4px;color:var(--muted)}
.custom{display:none;margin-top:14px;padding:16px;border:1px dashed var(--line);border-radius:12px}
.custom.show{display:block}
.go{display:block;width:100%;margin-top:6px;padding:16px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-family:'Nanum Myeongjo',serif;font-size:20px;font-weight:800;cursor:pointer;letter-spacing:1px}
.go:hover{filter:brightness(1.08)}
.err{color:var(--accent);font-size:14px;margin-top:8px;min-height:1em;text-align:center}

/* result */
#result{display:none}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.person{text-align:center}
.person .av{width:76px;height:76px;font-size:36px}
.person .nm{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px}
.person .meta{font-size:13px;color:var(--muted)}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num strong{font-family:'Nanum Myeongjo',serif;font-size:44px;line-height:1;color:var(--accent)}
.ring .num span{font-size:12px;color:var(--muted);display:block}
.verdict{text-align:center;margin:18px 0 0}
.verdict h2{font-family:'Nanum Myeongjo',serif;font-size:26px;margin:0 0 4px}
.verdict p{margin:0;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.tag{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.tag.good{border-color:var(--wood);color:var(--wood)}
.tag.bad{border-color:var(--fire);color:var(--fire)}
.pillars-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pt{font-weight:700;margin-bottom:8px;font-size:15px}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.pl .h{font-size:11px;color:var(--muted);margin-bottom:4px}
.gz{border-radius:10px;padding:8px 0;color:#fff;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:24px;line-height:1.1;margin-bottom:4px}
.gz small{display:block;font-family:'Noto Sans KR';font-size:11px;font-weight:400;opacity:.9}
.gz.empty{background:var(--line)!important;color:var(--muted)}
.day-mark{outline:2px solid var(--gold);outline-offset:2px}
.el-row{display:grid;grid-template-columns:56px 1fr 1fr;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.bar.l{justify-content:flex-end}
.bar i{display:block;height:100%;border-radius:6px;transition:width .8s}
.el-head{display:grid;grid-template-columns:56px 1fr 1fr;gap:10px;font-size:12px;color:var(--muted)}
.el-head span:nth-child(2){text-align:right}
.sec{border-top:1px solid var(--line);padding:16px 0}
.sec:first-child{border-top:0;padding-top:0}
.sec h3{font-family:'Nanum Myeongjo',serif;font-size:18px;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.sec p{margin:0}
.quote{background:var(--bg);border-left:4px solid var(--accent);padding:14px 16px;border-radius:0 10px 10px 0;font-family:'Nanum Myeongjo',serif;font-size:17px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.mini div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.mini b{display:block;font-size:20px;color:var(--accent2)}
.mini span{font-size:12px;color:var(--muted)}
.rank{display:grid;gap:10px}
.rk{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.rk:hover{border-color:var(--gold)}
.rk .no{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px;width:28px;color:var(--gold)}
.rk .av{width:40px;height:40px;font-size:20px;margin:0}
.rk .info{flex:1}
.rk .sc{font-weight:700;color:var(--accent);font-size:18px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.ch .cq{font-family:'Nanum Myeongjo',serif;font-size:12px;line-height:1.45;margin-top:8px;color:var(--ink);opacity:.8;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qnote{font-size:13px;color:var(--muted);margin-top:8px!important}
.btn.chat-open{background:var(--accent);color:#fff;border-color:var(--accent);font-size:16px;padding:15px}
/* chat */
.chat-bg{position:fixed;inset:0;background:rgba(20,14,8,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
.chat-bg.show{display:flex}
.chat{width:100%;max-width:520px;height:min(720px,92vh);background:var(--paper);border:1px solid var(--line);border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
@media (min-width:700px){.chat-bg{align-items:center}.chat{border-radius:20px}}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-h .av{width:42px;height:42px;font-size:21px;margin:0}
.chat-h .t{flex:1;min-width:0}
.chat-h .t b{display:block}
.mode{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.mode.ai{border-color:var(--wood);color:var(--wood)}
.ib{border:0;background:transparent;color:var(--ink);font-size:20px;cursor:pointer;width:36px;height:36px;border-radius:8px}
.ib:hover{background:var(--bg)}
.chat-set{display:none;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg);font-size:13px}
.chat-set.show{display:block}
.chat-set .row{display:flex;gap:6px;margin-top:6px}
.chat-set input{padding:8px 10px;font-size:13px}
.chat-set button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;cursor:pointer;white-space:nowrap}
.chat-set p{margin:6px 0 0;color:var(--muted);font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.m.c{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.u{align-self:flex-end;background:var(--accent2);color:#fff;border-bottom-right-radius:4px}
.m.sys{align-self:center;font-size:12px;color:var(--muted);background:transparent;padding:2px}
.m.typing{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px}
.chips button{flex:none;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
.chat-in{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.chat-in input{flex:1}
.chat-in button{padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.chat-in button:disabled{opacity:.5;cursor:default}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
.theme-t{position:fixed;top:14px;right:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:16px}
@media (max-width:640px){
  .vs{grid-template-columns:1fr 1fr}
  .vs .ring-box{grid-column:1/-1;order:-1;display:flex;justify-content:center}
  .pillars-wrap{grid-template-columns:1fr}
  .mini{grid-template-columns:repeat(2,1fr)}
  .gz{font-size:20px}
}
</style>
</head>
<body>
<button class="theme-t" id="themeT" aria-label="테마 전환">◐</button>
<div class="wrap">
  <header>
    <div class="seal">緣</div>
    <h1>드라마 사주 궁합</h1>
    <p class="sub">내 사주팔자와 최애 드라마 캐릭터의 인연을 풀어봅니다</p>
  </header>

  <section id="form">
    <div class="card">
      <div class="step"><b>1</b>나의 정보</div>
      <div class="grid">
        <div><label for="uName">이름</label><input id="uName" placeholder="홍길동" maxlength="12"></div>
        <div><label for="uDate">생년월일 (양력)</label><input id="uDate" type="date" min="1920-01-01" max="2025-12-31"></div>
        <div><label for="uTime">태어난 시간</label><select id="uTime"></select></div>
        <div><label>성별</label><div class="seg" id="uGender"><button data-v="F" class="on">여성</button><button data-v="M">남성</button></div></div>
      </div>
    </div>

    <div class="card">
      <div class="step"><b>2</b>궁합 볼 캐릭터</div>
      <div class="filters" id="filters">
        <button class="chip on" data-f="all">전체</button>
        <button class="chip" data-f="M">남자 캐릭터</button>
        <button class="chip" data-f="F">여자 캐릭터</button>
      </div>
      <div class="chars" id="chars"></div>
      <div class="custom" id="custom">
        <div class="grid">
          <div><label for="cName">캐릭터 이름</label><input id="cName" placeholder="예: 내 최애" maxlength="12"></div>
          <div><label for="cDrama">작품명</label><input id="cDrama" placeholder="예: 내가 쓴 드라마" maxlength="20"></div>
          <div><label for="cDate">캐릭터 생년월일</label><input id="cDate" type="date" min="1900-01-01" max="2030-12-31"></div>
          <div><label for="cTime">태어난 시간</label><select id="cTime"></select></div>
        </div>
      </div>
    </div>

    <button class="go" id="go">궁합 풀이 보기</button>
    <div class="err" id="err"></div>
  </section>

  <section id="result"></section>

  <footer>
    재미로 보는 사주 궁합입니다. 캐릭터 생년월일·시간은 이 서비스에서 임의로 정한 설정이며 원작 공식 설정이 아닙니다.<br>
    월주는 절기 근사일(입춘 2/4 등) 기준으로 계산하며, 실제 만세력과 경계일 전후로 차이가 날 수 있습니다.
  </footer>
</div>

<div class="chat-bg" id="chatBg">
  <div class="chat" role="dialog" aria-label="캐릭터 채팅">
    <div class="chat-h">
      <div class="av" id="chAv"></div>
      <div class="t"><b id="chName"></b><span class="mode" id="chMode">간단 모드</span></div>
      <button class="ib" id="chClose" title="닫기">✕</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chChips"></div>
    <form class="chat-in" id="chForm">
      <input id="chInput" placeholder="메시지를 입력하세요" maxlength="300" autocomplete="off">
      <button id="chSend">전송</button>
    </form>
  </div>
</div>

<script>
/* ===== 기본 데이터 ===== */
const STEM_H=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const STEM_K=['갑','을','병','정','무','기','경','신','임','계'];
const BR_H=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const BR_K=['자','축','인','묘','진','사','오','미','신','유','술','해'];
const ANIMAL=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
const STEM_EL=[0,0,1,1,2,2,3,3,4,4];
const BR_EL=[4,2,0,0,2,1,1,2,3,3,2,4];
const EL_NAME=['목(木)','화(火)','토(土)','금(金)','수(水)'];
const EL_SHORT=['나무','불','흙','쇠','물'];
const EL_VAR=['--wood','--fire','--earth','--metal','--water'];
const HOURS=['23:30~01:29','01:30~03:29','03:30~05:29','05:30~07:29','07:30~09:29','09:30~11:29','11:30~13:29','13:30~15:29','15:30~17:29','17:30~19:29','19:30~21:29','21:30~23:29'];

const DAY_MASTER=[
 {img:'곧게 뻗은 큰 나무',kw:['리더십','정의감','뚝심'],desc:'한번 정한 길은 끝까지 가는 직진형. 책임감이 강하지만 고집도 만만치 않아요.'},
 {img:'바람에 휘는 덩굴꽃',kw:['유연함','적응력','섬세함'],desc:'부드럽지만 끈질긴 생명력. 상대에 맞춰주는 듯하면서 결국 원하는 걸 얻어내요.'},
 {img:'한낮의 태양',kw:['열정','솔직함','존재감'],desc:'숨기는 게 없는 밝은 에너지. 있는 것만으로 분위기를 바꾸지만 식을 때도 확실해요.'},
 {img:'어둠을 밝히는 촛불',kw:['다정함','집중력','헌신'],desc:'겉은 차분해도 속은 뜨거운 타입. 한 사람에게 깊이 몰입하는 순정파예요.'},
 {img:'묵직한 큰 산',kw:['듬직함','포용력','신뢰'],desc:'흔들리지 않는 안정감의 소유자. 말수는 적어도 곁에 있으면 든든해요.'},
 {img:'씨앗을 품은 논밭',kw:['실속','배려','현실감각'],desc:'조용히 챙겨주는 생활형 다정함. 계산이 빠르지만 정이 많아요.'},
 {img:'단단한 바위와 무쇠',kw:['결단력','의리','추진력'],desc:'아닌 건 아닌 칼 같은 성격. 내 사람에게는 끝까지 의리를 지켜요.'},
 {img:'세공된 보석',kw:['감각','완벽주의','자존심'],desc:'예민하고 세련된 안목. 상처받기 쉽지만 그만큼 빛나는 존재예요.'},
 {img:'끝없이 넓은 바다',kw:['스케일','지혜','자유로움'],desc:'생각의 폭이 넓고 흐름을 읽는 전략가. 얽매이는 걸 싫어해요.'},
 {img:'촉촉한 봄비와 이슬',kw:['감수성','직관','공감력'],desc:'말하지 않아도 마음을 읽는 섬세함. 조용히 스며드는 매력이 있어요.'}
];

/* 캐릭터 — 생년월일/시는 서비스용 임의 설정 */
const CHARS=[

/* ===== 사주 계산 ===== */
function jdn(y,m,d){const a=Math.floor((14-m)/12),Y=y+4800-a,M=m+12*a-3;
  return d+Math.floor((153*M+2)/5)+365*Y+Math.floor(Y/4)-Math.floor(Y/100)+Math.floor(Y/400)-32045;}
// 절입 근사일: [월, 일, 월지]
const TERMS=[[1,6,1],[2,4,2],[3,6,3],[4,5,4],[5,6,5],[6,6,6],[7,7,7],[8,8,8],[9,8,9],[10,8,10],[11,7,11],[12,7,0]];
function calcSaju(dateStr,hr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const sy=(m<2||(m===2&&d<4))?y-1:y;
  const yi=((sy-4)%60+60)%60, ys=yi%10, yb=yi%12;
  let mb=0; for(const t of TERMS){ if(m>t[0]||(m===t[0]&&d>=t[1])) mb=t[2]; }
  const off=(mb-2+12)%12, ms=((ys%5)*2+2+off)%10;
  const di=((jdn(y,m,d)+49)%60+60)%60, ds=di%10, db=di%12;
  let hs=null,hb=null;
  if(hr!==null&&hr!==undefined&&hr!==''&&hr>=0){hb=Number(hr);hs=((ds%5)*2+hb)%10;}
  const p={hour:hb===null?null:[hs,hb],day:[ds,db],month:[ms,mb],year:[ys,yb]};
  const el=[0,0,0,0,0];
  for(const k of ['hour','day','month','year']){const v=p[k];if(!v)continue;el[STEM_EL[v[0]]]++;el[BR_EL[v[1]]]++;}
  return {p,el,total:el.reduce((a,b)=>a+b,0),dm:ds,dmEl:STEM_EL[ds],yb,db};
}

  if((a+b)%12===1) return 'yukhap';
  if(Math.abs(a-b)===6) return 'chung';
  if(WONJIN.has(Math.min(a,b)+'-'+Math.max(a,b))) return 'wonjin';
  if(a%4===b%4) return 'samhap';
  return 'none';
}
function stemRel(u,c){
  const ue=STEM_EL[u],ce=STEM_EL[c];
  if(Math.abs(u-c)===5) return 'hap';
  if(ue===ce) return 'same';
  if((ue+1)%5===ce) return 'uGen';
  if((ce+1)%5===ue) return 'cGen';
  if((ue+2)%5===ce) return 'uKe';
  return 'cKe';
}
function compat(U,C){
  let s=62; const tags=[]; const sub={love:60,talk:60,stable:60,spark:60};
  const sr=stemRel(U.dm,C.dm);
  const SR={hap:[15,'천간합',1,{love:22,spark:18,talk:8,stable:8}],uGen:[9,'상생 (내가 북돋움)',1,{stable:15,talk:10,love:8,spark:0}],
    cGen:[9,'상생 (상대가 북돋움)',1,{stable:12,love:12,talk:8,spark:2}],same:[4,'비화 (같은 기운)',1,{talk:20,stable:5,love:0,spark:-4}],
    uKe:[-6,'상극 (내가 주도)',0,{spark:18,love:-4,stable:-10,talk:-4}],cKe:[-6,'상극 (상대가 주도)',0,{spark:20,love:-2,stable:-12,talk:-6}]};
  const r=SR[sr]; s+=r[0]; tags.push([r[1],r[2]]); for(const k in r[3]) sub[k]+=r[3][k];
  const dr=brRel(U.db,C.db);
  const DR={yukhap:[12,'일지 육합',1,{love:15,stable:12}],samhap:[8,'일지 삼합',1,{talk:12,stable:8}],chung:[-12,'일지 충',0,{stable:-18,spark:15}],
    wonjin:[-7,'일지 원진',0,{talk:-12,love:-5}],same:[2,'같은 일지',1,{talk:8}],none:[0,null,1,{}]};
  const d=DR[dr]; s+=d[0]; if(d[1]) tags.push([d[1],d[2]]); for(const k in d[3]) sub[k]+=d[3][k];
  const yr=brRel(U.yb,C.yb);
  const YR={yukhap:[5,'띠 육합',1],samhap:[4,'띠 삼합',1],chung:[-5,'띠 충',0],wonjin:[-3,'띠 원진',0],same:[1,'동갑내기 띠',1],none:[0,null,1]};
  const y=YR[yr]; s+=y[0]; if(y[1]) tags.push([y[1],y[2]]);
  // 오행 보완
  const comp=[];
  for(let i=0;i<5;i++){
    if(U.el[i]===0&&C.el[i]>=2){s+=4;comp.push({who:'c',el:i});}
    if(C.el[i]===0&&U.el[i]>=2){s+=3;comp.push({who:'u',el:i});}
  }
  if(comp.length){tags.push(['오행 보완',1]);sub.stable+=6*Math.min(comp.length,2);}
  s=Math.max(38,Math.min(98,Math.round(s)));
  for(const k in sub) sub[k]=Math.max(30,Math.min(99,Math.round(sub[k]+(s-62)*.4)));
  return {score:s,sr,dr,yr,tags,comp,sub};
}

function hasBatchim(w){const c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;}
function j(w,pair){const [a,b]=pair.split('/');return w+(hasBatchim(w)?a:b);}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function verdict(s){
  if(s>=90) return ['천생연분','드라마 마지막 회 엔딩 키스급 인연'];
  if(s>=80) return ['운명적 끌림','시즌2 확정! 시청률 보장 커플'];
  if(s>=70) return ['설레는 케미','서서히 스며드는 로맨스 서사'];
  if(s>=60) return ['노력형 인연','갈등을 넘어 성장하는 커플'];
  if(s>=50) return ['애증의 관계','삼각관계 서브 남주/여주 포지션'];
  return ['험난한 로맨스','온 세상이 반대해도... 정말 괜찮겠어요?'];
}

    uGen:`당신의 ${ue} 기운이 ${j(cN,'의/의')} ${ce} 기운을 살려주는 <b>상생</b> 관계예요. 당신이 ${j(cN,'을/를')} 키워주고 챙겨주는 쪽. ${j(cN,'은/는')} 당신 곁에서 점점 더 빛나게 됩니다.`,
    cGen:`${j(cN,'의/의')} ${ce} 기운이 당신의 ${ue} 기운을 북돋아 주는 <b>상생</b> 관계예요. 지칠 때 기대면 말없이 어깨를 내어줄 사람. 당신은 이 관계에서 사랑받는 쪽입니다.`,
    same:`둘 다 ${ue}의 기운을 타고난 <b>비화</b> 관계예요. 말이 잘 통하고 친구처럼 편하지만, 닮은 만큼 고집도 닮아서 주도권 싸움이 생길 수 있어요.`,
    uKe:`당신의 ${ue} 기운이 ${j(cN,'의/의')} ${ce} 기운을 누르는 <b>상극</b> 관계예요. 당신이 주도권을 쥐게 되지만, ${j(cN,'이/가')} 답답함을 느끼지 않도록 숨 쉴 틈을 주는 게 중요해요. 대신 긴장감 넘치는 케미는 최고!`,
    cKe:`${j(cN,'의/의')} ${ce} 기운이 당신의 ${ue} 기운을 누르는 <b>상극</b> 관계예요. 자꾸 휘둘리는 것 같은데 이상하게 끌리는, 전형적인 '나쁜 남자/여자' 서사. 자존감을 지키는 게 연애 성공의 열쇠예요.`

function brText(dr,yr,uN,cN){

function compText(comp,U,C,cN){

}

    <div class="step">${esc(uN)}님의 운명 캐릭터 TOP 3</div>
    <div class="rank">${ranks.map((r,i)=>`<div class="rk" data-id="${r.c.id}"><div class="no">${i+1}</div>
      <div class="av" style="background:${grad(r.c.c)}">${r.c.emoji}</div>
      <div class="info"><b>${r.c.name}</b><div style="font-size:12px;color:var(--muted)">${r.c.drama}</div></div>
      <div class="sc">${r.s}점</div></div>`).join('')}</div>
  </div>

  <div class="btns">
    <button class="btn chat-open" id="chatOpen">💬 ${esc(cN)}${hasBatchim(cN)?'과':'와'} 대화하기</button>
  </div>
  <div class="btns" style="margin-top:10px">
    <button class="btn" id="again">다른 캐릭터와 보기</button>
    <button class="btn primary" id="copy">결과 복사하기</button>
  </div>`;

  $('form').style.display='none'; $('result').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
  requestAnimationFrame(()=>setTimeout(()=>{
    $('arc').style.strokeDashoffset=circ*(1-R.score/100);
    document.querySelectorAll('.bar i').forEach(el=>el.style.width=el.dataset.w+'%');
    let n=0; const tgt=R.score; const iv=setInterval(()=>{n+=2;if(n>=tgt){n=tgt;clearInterval(iv);}$('scoreNum').textContent=n;},18);
  },60));
  $('again').onclick=()=>{$('result').style.display='none';$('form').style.display='block';window.scrollTo({top:0,behavior:'smooth'});};
  $('copy').onclick=()=>{
    const txt=`[드라마 사주 궁합] ${uN} ♥ ${cN}(${C.drama}) — ${R.score}점 「${vt}」 ${vs}`;
    const done=()=>{$('copy').textContent='복사 완료!';setTimeout(()=>$('copy').textContent='결과 복사하기',1500);};
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done,done); else done();
  };
  CTX={user,U,C,CS,R,vt};
  $('chatOpen').onclick=openChat;
  document.querySelectorAll('.rk').forEach(el=>el.onclick=()=>{selected=el.dataset.id;renderChars();showResult(user,getChar(selected));});
}

/* ===== 캐릭터 채팅 ===== */
let CTX=null, HIST=[], BUSY=false;
// 서버(/api/chat)에 ANTHROPIC_API_KEY 가 설정돼 있으면 AI 모드, 아니면 간단 모드
let AI_ON=false;
fetch('/api/chat').then(r=>r.ok?r.json():{ai:false}).then(j=>{AI_ON=!!j.ai;updateMode();}).catch(()=>{AI_ON=false;});
function fill(t,u,s,v){return t.replace(/\{u\}/g,u).replace(/\{s\}/g,s).replace(/\{v\}/g,v);}

function updateMode(){
  const on=AI_ON;
  $('chMode').textContent=on?'Claude AI 대화':'간단 모드';
  $('chMode').classList.toggle('ai',on);
}
function addMsg(cls,text){
  const d=document.createElement('div'); d.className='m '+cls; d.textContent=text;
  $('msgs').appendChild(d); $('msgs').scrollTop=$('msgs').scrollHeight; return d;
}
function openChat(){
  if(!CTX) return;
  const {C,user,R,vt}=CTX, X=extraOf(C), T=TONES[X.tone];
  HIST=[];
  $('chAv').style.background=grad(C.c); $('chAv').textContent=C.emoji;
  $('chName').textContent=C.name+' · '+C.drama;
  $('msgs').innerHTML='';
  addMsg('sys',`궁합 ${R.score}점 「${vt}」 · 대화 내용은 캐릭터를 흉내 낸 창작이에요`);
  addMsg('c',fill(T.greet,user.name,R.score,vt));
  $('chChips').innerHTML=['안녕!','우리 궁합 어때?','오늘 뭐 했어?','요즘 좀 힘들어','네 명대사 들려줘']
    .map(t=>`<button type="button">${t}</button>`).join('');
  updateMode();
  $('chatBg').classList.add('show'); setTimeout(()=>$('chInput').focus(),50);
}
function closeChat(){$('chatBg').classList.remove('show');}

function offlineReply(text){
  const {C,user,R,vt}=CTX, X=extraOf(C), T=TONES[X.tone], u=user.name;
  let r;
  if(/명대사|대사|한마디/.test(text)) r=`“${X.q}”`;
  else if(/궁합|사주|점수|운명|인연|팔자/.test(text)) r=T.gung;
  else if(/안녕|하이|반가|ㅎㅇ|hello|hi/i.test(text)) r=T.greet;
  else if(/사랑|좋아|설레|보고\s?싶|귀여|멋있|예뻐/.test(text)) r=T.love;
  else if(/힘들|슬퍼|슬프|우울|지쳐|피곤|외로|울고/.test(text)) r=T.comfort;
  else if(/뭐\s?해|뭐\s?하|뭐\s?했|오늘/.test(text)) r=T.doing;
  else r=T.def[Math.floor(Math.random()*T.def.length)];
  r=fill(r,u,R.score,vt);
  if(X.tic&&Math.random()<.3) r+=' '+X.tic;
  return r;
}

// 서버 함수 /api/chat 호출. 시스템 프롬프트는 서버에서 만들고, 응답은 텍스트 스트림으로 받는다.
const ERR_MSG={auth:'서버의 API 키가 올바르지 않아요',permission:'서버 API 키로 모델을 쓸 수 없어요',rate:'요청이 많아요. 잠시 후 다시 시도해 주세요',
  connection:'Claude 서버에 연결하지 못했어요',api:'AI 응답 중 오류가 났어요'};
async function claudeReply(onText){
  const {C,user,R,vt}=CTX;
  const payload={
    charId:C.id,
    custom:C.custom?{name:C.name,drama:C.drama,date:C.date,hr:C.hr<0?null:C.hr}:undefined,
    user:{name:user.name,date:user.date,hr:user.hr<0?null:user.hr,gender},
    compat:{score:R.score,verdict:vt,tags:R.tags.map(t=>t[0])},
    messages:HIST
  };
  let res;
  try{ res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); }
  catch(e){ throw new Error('서버에 연결하지 못했어요'); }
  if(res.status===503){ AI_ON=false; updateMode(); throw new Error('서버에 AI가 설정되어 있지 않아요'); }
  if(!res.ok||!res.body) throw new Error('요청 오류 ('+res.status+')');
  const reader=res.body.getReader(), dec=new TextDecoder(); let all='';
  for(;;){
    const {done,value}=await reader.read(); if(done) break;
    all+=dec.decode(value,{stream:true});
    const cut=all.indexOf('\u0000');
    onText(cut<0?all:all.slice(0,cut));
  }
  all+=dec.decode();
  const cut=all.indexOf('\u0000');
  if(cut>=0){
    const mark=all.slice(cut+1);
    if(mark==='refusal') return {refusal:true};
    if(mark.startsWith('error:')) throw new Error(ERR_MSG[mark.slice(6)]||ERR_MSG.api);
  }
  return {text:(cut<0?all:all.slice(0,cut)).trim()};
}

async function send(text){
  text=text.trim(); if(!text||BUSY||!CTX) return;
  $('chInput').value=''; addMsg('u',text);
  if(!AI_ON){
    BUSY=true; const t=addMsg('c typing','...');
    setTimeout(()=>{t.classList.remove('typing');t.textContent=offlineReply(text);BUSY=false;
      $('msgs').scrollTop=$('msgs').scrollHeight;},500+Math.random()*500);
    return;
  }
  BUSY=true; $('chSend').disabled=true;
  HIST.push({role:'user',content:text});
  const bubble=addMsg('c typing','...'); let got='';
  try{
    const r=await claudeReply(t=>{if(!t)return;got=t;bubble.classList.remove('typing');bubble.textContent=got;$('msgs').scrollTop=$('msgs').scrollHeight;});
    if(r.refusal||!r.text){
      HIST.pop(); bubble.classList.remove('typing'); bubble.textContent=offlineReply(text);
      addMsg('sys','이 질문엔 AI가 답하지 않아 간단 모드로 대답했어요');
    }else{ bubble.textContent=r.text; HIST.push({role:'assistant',content:r.text}); }
  }catch(e){
    HIST.pop(); bubble.classList.remove('typing'); bubble.textContent=offlineReply(text);
    addMsg('sys',e.message+' · 간단 모드로 대답했어요');
  }finally{ BUSY=false; $('chSend').disabled=false; $('msgs').scrollTop=$('msgs').scrollHeight; }
}

$('chForm').addEventListener('submit',e=>{e.preventDefault();send($('chInput').value);});
$('chChips').addEventListener('click',e=>{const b=e.target.closest('button');if(b)send(b.textContent);});
$('chClose').onclick=closeChat;
$('chatBg').addEventListener('click',e=>{if(e.target===$('chatBg'))closeChat();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeChat();});

// 테마 토글
$('themeT').onclick=()=>{
  const r=document.documentElement, cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.dataset.theme=cur==='dark'?'light':'dark';
};
